name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      # Mintlify's CLI, at one exact version, so a run gives the same result twice: moved up on
      # purpose, as a commit of its own, never by whatever was published last.
      - run: npm install --global mint@4.2.1021
      - name: Build
        run: mint validate
      - name: Links
        run: mint broken-links
      - name: Screenshots, icons and pages
        run: node .github/scripts/check.mjs
